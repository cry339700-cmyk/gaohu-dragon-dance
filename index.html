<script type="application/json" id="guide-topics">[{"id": "welcome", "label": "听我介绍", "title": "你好，我是福珑儿", "keywords": ["你好", "你是谁", "福珑儿", "介绍", "导览", "展馆", "怎么玩"], "text": "你好，我是福珑儿。这里是福州高湖舞龙灯数字展馆。你可以拖动球幕，点开一张展卡，也可以问我高湖的来历、九节布龙怎么舞，或者舞龙时为什么要敲鼓。"}, {"id": "history", "label": "高湖来历", "title": "龙灯从哪里来？", "keywords": ["历史", "来历", "起源", "源流", "多久", "多少年", "村", "把社", "哪来", "地名", "哪里", "在哪", "高湖"], "text": "高湖舞龙灯流传于福州仓山盖山一带。相传明末清初，有村民把学来的舞灯技艺带回高湖。早年龙节内点着蜡烛，夜里舞起来，一节接一节，像灯火在游走。"}, {"id": "heritage", "label": "非遗名录", "title": "高湖舞龙灯是什么级别的非遗？", "keywords": ["非遗", "名录", "级别", "省级", "国家级", "2009", "保护单位", "申遗", "公布"], "text": "福州高湖舞龙灯在二零零九年五月三十一日，列入福建省第三批省级非物质文化遗产名录，类别是传统舞蹈。保护单位是福州市仓山区文化馆。"}, {"id": "pearl", "label": "九节布龙", "title": "一珠在前，九节相随", "keywords": ["九节", "布龙", "龙珠", "引珠", "龙头", "跟着", "几个人", "多少人", "十人", "龙具", "竹"], "text": "高湖的布龙用竹条做骨架，再包上画有龙鳞的布。舞龙时，一人持珠引路，九人分执龙节。龙头先追珠，后面的队员跟住前一节，把十个人的动作连成一条龙。"}, {"id": "moves", "label": "动作图谱", "title": "看懂一招一式", "keywords": ["动作", "图谱", "八字", "8字", "招式", "舞法", "结花", "解花", "教学", "龙穿", "四十一", "41"], "text": "高湖民间舞法里有结花和解花，舞者跟随龙珠变换方位，龙身先结起，再顺势展开。展馆的动作图谱还有四十一式竞技舞龙教材图例，和高湖民间套路分开展示。"}, {"id": "drum", "label": "鼓乐民俗", "title": "听鼓点，看龙身起落", "keywords": ["鼓", "锣", "鼓点", "乐器", "十番", "闽剧", "急急风", "伴奏", "节拍", "音乐", "民俗", "香袋", "请龙烛"], "text": "高湖舞龙灯用过笛、胡琴、唢呐、三弦和锣钹等伴奏，后来也采用福州十番音乐，吸收闽剧锣鼓里的急急风。看龙头什么时候扬起，龙身什么时候折转，可以先听听鼓点的轻重缓急。"}]</script>

const cues=['看龙头在身体左右交替回环。','留意八字路线与整队前行的叠加。','看队员磨转时龙体如何保持圆顺。','看两位队员背部相靠的相对位置。','循着图中的龙身，辨认它如何绕过舞者。','观察下蹲与躺姿在队列中的位置。','观察跳龙后队员姿态如何组成摇船之形。','辨认直躺队员与龙身交会的位置。','留意挂腰组合中龙体的运动空间。','观察队员身体组合出的“K”字轮廓。','辨认支撑者与站腿队员的位置。','顺着龙身，从相邻两节间辨认一起一落。','观察队伍沿一个方向转过的小圆场。','观察队员降低重心时的圆场队形。','沿龙头的路线找出龙身的曲线变化。','注意斜圆场中的高低关系。','留意骑肩组合与双杆之间的关系。','从图中对照站肩位置与龙头平盘的高度。','找出龙头与龙尾交错的穿行位置。','看龙尾上方为腾越留出的空间。','对照首尾相遇时的走向。','沿龙头路线辨认它穿过的龙身区段。','辨认原本交叠的龙身在何处解开。','分辨穿过龙尾与越过龙身的位置。','留意卧龙与腾起之间的高低对照。','由尾向前数，找出第八节与第五节的位置。','对照连续穿越与腾越的路线。','观察队伍行进与跳龙的方向关系。','比较两幅图中龙身立圆的变化。','沿龙身找出连续的螺旋走势。','看螺旋跳龙与磨转如何共用一个运动中心。','观察左右两侧的螺旋方向。','找出拱起如门的龙身轮廓。','从龙尾向前追踪盘绕的层次。','沿龙身描出完整队形的曲线。','观察龙头从围合造型中探出的位置。','从侧面辨认龙舟的船头与船身。','留意高塔的层次与龙身盘绕的中心。','辨认高翘的龙尾与龙珠之间的位置。','看首尾如何围绕竖直中心构成柱形。','从整体队形辨认横向展开的大“8”字。'];
const pad = n=>String(n).padStart(2,'0');
const make = (tag,cls,txt)=>{const el=document.createElement(tag); if(cls)el.className=cls;if(txt!==undefined)el.textContent=txt;return el;};
const button=(cls,txt,title)=>{const el=make('button',cls,txt);el.type='button';if(title)el.setAttribute('aria-label',title);return el;};
window.renderMoves = function(container, initial){
  if (!container) return;
  container.replaceChildren();
  const box=make('section','mv-archive');box.setAttribute('aria-label','舞龙动作图谱');
  const tabs=make('div','mv-tabs');tabs.setAttribute('role','group');tabs.setAttribute('aria-label','按动作类别筛选');
  const body=make('div','mv-body'),panel=make('div','mv-panel'),detail=make('div','mv-details');
  const paper=make('figure','mv-paper'),illustration=make('img','mv-illustration');illustration.decoding='async';
  const stamp=make('span','mv-stamp','动作图录'),caption=make('figcaption','mv-caption'),capname=make('b'),capnote=make('span');
  const flip=button('mv-flip','切换图例','切换同一动作的另一幅图示');
  const media=make('div','mv-media'),play=button('mv-play','▶　播放本式真人示范'), note=make('p','mv-reel-note');
  const tools=make('div','mv-tools'),back=button('mv-display mv-back','看教材原图'),links=make('div','mv-links');
  media.append(illustration,play,stamp,flip);tools.append(back,links);paper.append(media);caption.append(capname,capnote,note,tools);paper.append(caption);
  const eyebrow=make('div','mv-eyebrow'),groupTitle=make('h3','mv-group'),summary=make('p','mv-intro'),list=make('div','mv-index');
  list.setAttribute('role','group');list.setAttribute('aria-label','选择本类动作');
  const nav=make('div','mv-nav'),prev=button('mv-turn','←','上一个动作'),next=button('mv-turn','→','下一个动作'),count=make('span','mv-count'),live=make('span','mv-sr');
  live.setAttribute('aria-live','polite');
  nav.append(prev,count,next);
  detail.append(eyebrow,groupTitle,summary,list,nav);
  panel.append(paper);body.append(panel,detail);box.append(tabs,body,live);container.append(box);
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
  const studyURL=GaohuEmbedded('assets/study/figure-eight.gif');
  let current=0,gid=0,frame=0,studyOn=!reduceMotion.matches;
  const artToggle=button('mv-back mv-display','对照教材图');
  const saveStudy=make('a','mv-source','下载本式 GIF');saveStudy.href=studyURL;saveStudy.download='01-原地八字舞龙-动作示意.gif';
  artToggle.onclick=()=>{studyOn=!studyOn;frameDraw();artToggle.focus({preventScroll:true});};
  const onReduced=ev=>{if(ev.matches&&current===0&&studyOn&&!player){studyOn=false;frameDraw();}};
  reduceMotion.addEventListener('change',onReduced);
  
  function select(idx,say=true){
    current=idx;frame=0;studyOn=!reduceMotion.matches;
    const [name]=records[idx], local=idx-groups[gid][1]+1, n=groups[gid][2]-groups[gid][1];
    capname.textContent=pad(idx+1)+'　'+name;capnote.textContent=cues[idx];count.textContent=pad(local)+' / '+pad(n);
    prev.disabled=local===1;next.disabled=local===n;
    Array.from(list.children).forEach((e,j)=>e.setAttribute('aria-pressed',String(j===local-1)));
    frameDraw();
    if(say)live.textContent=groups[gid][0]+'，'+name+'，本类第'+local+'式。';
  }
  let player=null;
  function showStill(){
    if(player){player.remove();player=null;}
    illustration.hidden=false;stamp.hidden=false;back.hidden=true;
  }
  function frameDraw(){
    showStill();
    const [name,frames]=records[current],r=srcMap[pad(current+1)], id=frames[frame],v=r?.main,course=r?.course,pep=r?.pep;
    illustration.src=GaohuEmbedded('assets/moves/'+id+'.webp');illustration.alt=name+'教材原图'+(frames.length===2?'，第'+(frame+1)+'幅':'');
    stamp.textContent='教材原图';flip.hidden=frames.length===1;flip.textContent='图 '+(frame+1)+' / '+frames.length+'　⇄';
    const hasStudy=current===0;
    if(hasStudy){
      if(studyOn){illustration.src=studyURL;illustration.alt='原创动作示意：队员原地立稳，连续换向举杆，龙身随各节依次起落。';stamp.textContent='原创动作示意';}
      artToggle.textContent=studyOn?'对照教材原图':'播放本式动图';artToggle.setAttribute('aria-label',studyOn?'暂停动图，查看教材原图':'播放本式原创动作示意动图');
      tools.insertBefore(artToggle,back);tools.insertBefore(play,links);
    }else{artToggle.remove();media.append(play);}
    links.replaceChildren();if(hasStudy)links.append(saveStudy);play.hidden=!v&&!course&&!pep;
    if(pep){const a=outbound(current===0?'人教版真人教学 ↗':'人教版教材演示 ↗',pep.url,'mv-source');a.setAttribute('aria-label','打开人教版教材演示：'+pep.title);links.append(a);}
    if(v){
       play.textContent=v.variant?'▶　观看越障碍变式':'▶　播放本式真人示范';
       const source=v.provider==='bilibili'?'哔哩哔哩':'YouTube';
       const loc=v.start>0?' · '+timecode(v.start):'';
       note.textContent=(v.variant?'相关变式，含越障碍。原片：':'原片：')+v.title+' · '+source+loc;
       links.append(outbound(source+' 原片 ↗',v.sourceUrl,'mv-source'));
    }else if(pep){
       play.textContent='打开人教版教材演示 ↗';note.textContent='人教版教材演示：《'+pep.title+'》。在出版社原页查看。';
    }else if(course){
       play.textContent='打开课程章节 ↗';note.textContent='课程章节：《'+course.title+'》。在主讲方原课查看。';
    }else{note.textContent='此式暂只展示教材原图，尚未核对到对应的实拍分解。';}
    if(hasStudy&&studyOn)note.textContent='动图为原创动作示意，不是实拍。'+note.textContent;
    if(pep&&v){note.textContent+='。另附人教版同式教材演示。';}
    if(r?.extra)links.append(outbound('分段教学',r.extra.sourceUrl,'mv-source'));
    if(course)links.append(outbound('国内课程 ↗',course.url,'mv-source'));
  }
  play.onclick=()=>{
    const r=srcMap[pad(current+1)],v=r?.main;
    if(!v||location.protocol==='file:'){const dest=v?.sourceUrl||r?.pep?.url||r?.course?.url;if(dest)window.open(dest,'_blank','noopener,noreferrer');return;}
    showStill();artToggle.remove();player=make('iframe','mv-player');
    const url=v.provider==='bilibili'?new URL('https://player.bilibili.com/player.html'):new URL('https://www.youtube-nocookie.com/embed/'+v.videoId);
    if(v.provider==='bilibili'){
       Object.entries({bvid:v.videoId,page:v.page,cid:v.cid,autoplay:'1',danmaku:'0'}).forEach(([k,value])=>{if(value!=null)url.searchParams.set(k,value)});
    }else{
       url.searchParams.set('start',v.start||0);if(v.end!=null)url.searchParams.set('end',v.end);
       url.searchParams.set('autoplay','1');url.searchParams.set('rel','0');url.searchParams.set('playsinline','1');
    }
    player.title='真人舞龙示范：'+records[current][0];player.allow='autoplay; fullscreen; picture-in-picture; encrypted-media';player.allowFullscreen=true;
    player.referrerPolicy='strict-origin-when-cross-origin';player.src=url.href; illustration.hidden=true;play.hidden=true;flip.hidden=true;stamp.hidden=true;back.hidden=false;media.append(player);
    note.textContent='正在打开原站播放器；若未加载，可用下方链接观看。';back.focus({preventScroll:true});
  };
  back.onclick=()=>{studyOn=false;frameDraw();if(!play.hidden)play.focus({preventScroll:true});};
  function group(i,announce=true){
    gid=i; const [title,from,to,desc]=groups[i];
    Array.from(tabs.children).forEach((b,j)=>b.setAttribute('aria-pressed',String(j===i)));
    eyebrow.textContent='动作分类　/　'+pad(i+1);
    groupTitle.textContent=title;summary.textContent=desc;
    list.replaceChildren();
    records.slice(from,to).forEach(([name],j)=>{
      const b=button('mv-item','');b.append(make('span','mv-seq',pad(j+from+1)),make('span','mv-name',name));
      b.onclick=()=>select(j+from);list.append(b);
    });select(from,announce);
  }
  const step=(v)=>{const i=current+v;if(i<groups[gid][1]||i>=groups[gid][2])return;select(i);
    const active=list.children[i-groups[gid][1]];const ar=active.getBoundingClientRect(),lr=list.getBoundingClientRect();
    if(ar.bottom>lr.bottom)list.scrollTop+=ar.bottom-lr.bottom;else if(ar.top<lr.top)list.scrollTop-=lr.top-ar.top;};
  groups.forEach(([label,from,to],i)=>{const b=button('mv-tab','');b.append(make('span','',label),make('small','',pad(to-from)));b.onclick=()=>group(i);tabs.append(b);});
  prev.onclick=()=>step(-1);next.onclick=()=>step(1);
  flip.onclick=()=>{frame=(frame+1)%records[current][1].length;frameDraw();live.textContent=records[current][0]+'，图'+(frame+1);};
  const field=make('section','mv-field'),fieldVid=make('video','mv-field-film');
  fieldVid.controls=true;fieldVid.playsInline=true;fieldVid.preload='none';fieldVid.poster=GaohuEmbedded('assets/field/field-dance.jpg');fieldVid.src=GaohuEmbedded('assets/field/field-dance.mp4');fieldVid.setAttribute('aria-label','多人舞龙现场实拍');
  const prose=make('div','mv-field-text');prose.append(make('div','eyebrow ink','FIELD RECORDING'),make('h3','','看龙队合舞'),make('p','','从队员手里的龙杆看起，再顺着龙头看后面几节如何跟上。这是项目资料中的一段街头实拍，不是上方所选招式的分解。'));
  const gif=outbound('查看现场 GIF ↗',GaohuEmbedded('assets/field/field-dance.gif'),'mv-source');
  const dl=make('a','mv-source','保存现场 GIF');dl.href=gif.href;dl.download='多人舞龙现场实拍.gif';
  const actions=make('div','mv-links');actions.append(gif,dl);prose.append(actions);field.append(fieldVid,prose);box.append(field);
  const preferred = /^([0-9]{1,2})$/.test(initial||"") ? Number(initial)-1 : 0;
  const match=groups.findIndex(([,lo,hi])=>preferred>=lo&&preferred<hi);
  group(match<0?0:match,false);
  if(match>=0&&preferred!==groups[match][1])select(preferred,false);
  return ()=>reduceMotion.removeEventListener('change',onReduced);
};
})();

 ['扎龙','竹为骨，布作鳞','匠人用竹条编出龙头、龙身与龙尾的内框。麻布或纱布经过染色、上油，再绘上鳞甲，包覆于竹架之上。给各节安上木柄，才成了一条可以擎起、穿转的布龙。','扎骨架　→　染布绘鳞　→　包覆龙节　→　安装木柄'],
 ['引珠','一珠在前，九节相随','一人持珠引路，九人分执九节。龙头不是独舞：持珠人一换方向，龙头先追，后面每一节都要接住前一节的走势，把十个人的动作连成一条游龙。','随前节，顾后节，勿前推，忌后拉。'],
 ['结花','队形在行进中成结','高湖舞法以对称的正、副太极图为队形基础。舞者随龙珠变换方位，左右结花；随后以龙穿洞或圆盘翻肚解花。看似纠结的龙身，要在节节相顾中顺畅展开。','看高湖，宜先看队形怎样结起，再看龙头从何处引出。'],
 ['换把','一推一收，转手吞节','“臂头落”与“转手吞节”是高湖舞法的动作口诀。前者由旁划接垂直上举；后者靠两手交替换把、推收滑动。不同龙节的步法有别，既要看龙珠，也要看身前身后的队友。','高湖民间程式以结花、解花见长；竞技动作另见「动作图谱」。']
 ],facts:[['龙具形制','九节布龙'],['协作分工','一珠 · 九执'],['队形基础','正、副太极图']]},
 rhythm:{title:'鼓乐民俗',en:'RHYTHM & RITUAL',no:'叁',art:'rhythm',alt:'带金色鼓钉的朱红传统大鼓与一对鼓槌',sub:'听锣鼓怎样催动龙身，也看龙队怎样走进人家。',data:[
 ['十番伴舞','龙身起落，自有鼓点','高湖早期伴奏有笛、胡琴、唢呐、三弦与锣钹等，后来采用福州十番音乐，也吸收闽剧打击乐【急急风】。听节拍的轻重缓急，再看龙头何时扬起、龙身何时折转。','十番是福州地方乐种；【急急风】是闽剧的锣鼓语汇。'],
 ['肩挎香袋','门前停灯，香袋盛礼','逢年过节，龙队巡游到家门，主人放鞭炮相迎。舞者肩挎的“香袋”并非舞具，而是装礼物和酬谢红包的布袋。门前的一段龙舞，也是一场主客相见的礼俗。','一只肩上的布袋，记下舞者与街坊之间的往来。'],
 ['请龙烛','把灯火请进喜事','当地人家遇到寿庆、添丁等喜事，会邀请龙灯队上门，称为“请龙烛”。早年的龙节内点烛照明，“龙烛”这个称呼，也留下了夜间游灯的记忆。','龙灯既在节日里巡游，也为寻常人家的喜事而舞。']
 ],facts:[['地方乐种','福州十番'],['闽剧锣鼓','急急风'],['高湖礼俗','香袋 · 请龙烛']]}
};
let current='',contentTab=0, dispose=null,readKey='',readCleanup=null;
window.exhibitOverlayOpen=()=>!!document.querySelector('dialog[open]');
function field(){return `<section class="ex-field-page"><header><div class="eyebrow ink">FIELD RECORDING</div><h1>看龙队合舞</h1><p>项目资料中的独立街头实拍。可观察队员举杆、龙头前行与各节跟进，并非某一式的标准分解。</p></header><video controls playsinline preload="metadata" poster="${GaohuEmbedded(`assets/field/field-dance.jpg`)}" src="${GaohuEmbedded(`assets/field/field-dance.mp4`)}" aria-label="多人舞龙现场实拍"></video><p><a href="${GaohuEmbedded(`assets/field/field-dance.gif`)}" download="多人舞龙现场实拍.gif">下载现场 GIF</a><a href="#moves">查看动作图谱</a></p></section>`;}
const label=k=>chapters[k]?.title||'动作图谱';
function intro(k){let c=chapters[k],is=!!c;return `<div class="intro"><div><div class="eyebrow ink">${c?.en||'MOVEMENT ATLAS'}</div><h1>${label(k)}</h1><p>${c?.sub||'选一式，看教材图，再看对应的真人示范。这里展示的是竞技舞龙，不与高湖民间套路混列。'}</p></div><span class="page-count">${is?'卷'+c.no:'四十一式'}</span></div>`}
function tabContent(c){let t=c.data[contentTab];return `<div class="eng">FIELD NOTES　/　0${contentTab+1}</div><h2>${t[1]}</h2><p>${t[2]}</p><div class="read-note">${t[3]}</div>`}
function inner(k){let c=chapters[k],order=['history','craft','rhythm','moves'],next=order[order.indexOf(k)+1];return `<section class="inner"><div class="container">${intro(k)}${c?`<div class="reading"><figure class="plate"><img src="${GaohuEmbedded(`assets/${c.art}.webp`)}" alt="${c.alt}"><figcaption>主题意象插画 · ${c.title}</figcaption></figure><div><div class="reader-tabs" aria-label="${c.title}阅读主题">${c.data.map((t,i)=>`<button data-tab="${i}" aria-pressed="${i===contentTab}" class="${i===contentTab?'sel':''}">${t[0]}</button>`).join('')}</div><div class="reader-copy" aria-live="polite">${tabContent(c)}</div></div></div><div class="facts">${c.facts.map(([x,y])=>`<div class="fact"><small>${x}</small><strong>${y}</strong></div>`).join('')}</div>`:'<div id="move-mount"></div><hr style="border:0;border-top:1px solid var(--line);margin:32px 0">'}<div class="next-row"><button class="text-link" data-source>查看资料说明</button><a class="btn light-btn" ${next?'href="#'+next+'"':'href="#ring" data-read-close'}>${next?'下一章 · '+label(next):'返回展览'}</a></div></div></section>`}

const read=$('#read'), readBody=$('#read-body');
const isReading=k=>Object.hasOwn(chapters,k)||k==='moves'||k==='field';
function clearReading(){
 readCleanup?.();readCleanup=null;readKey='';
 $$('video',readBody).forEach(v=>v.pause());
 readBody.replaceChildren();
}
function openReading(k,detail){
 window.clearGalleryEditor?.();clearReading();contentTab=0;readKey=k;
 readBody.innerHTML=k==='field'?field():inner(k);
 const heading=$('h1',readBody);heading.id='read-title';
 if(k==='moves')readCleanup=window.renderMoves($('#move-mount'),detail)||null;
 if(!read.open)read.showModal();
 readBody.scrollTop=0;$('#read-close').focus({preventScroll:true});
}
read.addEventListener('close',()=>{if(!read.open){window.clearGalleryEditor?.();clearReading();}});
document.addEventListener('keydown',e=>{
 if(e.key!=='Escape'||e.defaultPrevented||e.repeat)return;
 const dialog=$('#archive').open?$('#archive'):read.open?read:null;
 if(dialog){e.preventDefault();e.stopPropagation();if(!window.isGallerySaving?.())dialog.close();}
},true);
function mountPage(k){
 const main=$('#main'),isSphere=k==='sphere';
 dispose?.();
 main.innerHTML=isSphere?GaohuSphere.sphereMarkup():GaohuExhibit.home();
 dispose=isSphere?GaohuSphere.mount(main.firstElementChild):GaohuExhibit.mount(main.firstElementChild);
}
function refreshGallery(focusId=''){
 if(focusId){GaohuExhibit.select(focusId);GaohuSphere.select(focusId);}
 if(current==='sphere')GaohuSphere.skipIntro();
 mountPage(current);
}
function render(focus=false){
 const [request,detail]=location.hash.slice(1).split('/');
 const k=['sphere','gallery'].includes(request)?'sphere':'ring';
 if(request!==k && (request||detail))history.replaceState(null,'','#'+k);
 if(k!==current){
  if(read.open){read.close();clearReading();}
  current=k;
  const main=$('#main'),isSphere=k==='sphere';
  document.body.classList.toggle('sphere-world',isSphere);
  mountPage(k);
  $$('#nav a').forEach(a=>{const on=a.hash==='#'+k;a.classList.toggle('active',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  document.title=(isSphere?'龙珠球幕':'环形展陈')+' · 福鼓龙韵';
  window.scrollTo({top:0,behavior:'instant'});
  if(focus)main.focus({preventScroll:true});
 }
 if(isReading(request))openReading(request,detail);
 if(request==='add')window.openAddExhibit();
 if(request==='custom')window.openGalleryItem(GaohuEdit.customItem('custom:'+detail));
}
$('#present').onclick=()=>window.openShow(0);
$('#refs').innerHTML='<h3>策展底本</h3><p>《传统舞龙》提供动作名称及教学图例；《舞龙历史资料》与《舞龙传统表演形式》提供历史、舞法与民俗线索。《舞龙资料补充汇编》用于区分地域、核对项目级别和整理竞技动作分类。</p><h3>阅读口径</h3><p>福州高湖舞龙灯为福建省第三批省级非遗项目；起源传说以“相传”表述。动作图谱依汇编所据的2008年竞赛规则归类，不作现行裁判手册。</p><h3>资料出处</h3><ol><li>福建省文化和旅游厅：《福建省第三批省级非物质文化遗产名录》</li><li>人民网福建频道：《福州高湖舞龙灯》</li><li>福州晚报：《吴明忠：让高湖舞龙灯舞出新精彩》</li></ol><h3>图像说明</h3><p>封面与章节插画为主题创作，不是历史影像。动作图例取自《传统舞龙》，已校正方向并统一为暖色。教材图例保持静止。首式另有原创八字轨迹演示，定杆位置、队员姿态和龙体逐帧绘制，不代表实拍。单项示范通过原发布平台观看，来源、动作名与可用时间点见各式图注，不代表高湖本地实录。“看龙队合舞”节选自《福鼓龙韵》项目资料，是独立现场片段。</p>';
document.addEventListener('click',e=>{
 if(e.target.closest('.skip')){e.preventDefault();$('#main').focus();return;}
 if(e.defaultPrevented)return;
 if(e.target.closest('[data-read-close]')||e.target===read){e.preventDefault();if(!window.isGallerySaving?.())read.close();return;}
 const tab=e.target.closest('#read [data-tab]');
 if(tab&&Object.hasOwn(chapters,readKey)){
  contentTab=Number(tab.dataset.tab);
  $$('[data-tab]',readBody).forEach(b=>{let on=b===tab;b.classList.toggle('sel',on);b.setAttribute('aria-pressed',on);});
  $('.reader-copy',readBody).innerHTML=tabContent(chapters[readKey]);return;
 }
 if(e.target.closest('[data-source]')){$('#archive').showModal();return;}
 if(e.target.closest('#archive [data-close]')||e.target===$('#archive')){$('#archive').close();return;}
 const link=e.target.closest('a[href^="#"]');
 if(link){
  const [key,detail]=link.hash.slice(1).split('/');
  if(key==='add'){e.preventDefault();window.openAddExhibit();}
  else if(key==='custom'){e.preventDefault();window.openGalleryItem(GaohuEdit.customItem('custom:'+detail));}
  else if(isReading(key)){e.preventDefault();openReading(key,detail);}
  else if(['ring','sphere'].includes(key)&&key!==current&&read.open){read.close();}
 }
});
window.addEventListener('hashchange',()=>render(true));
icons();GaohuEdit.ready.then(()=>render());
</script>
<script>(() => {
 'use strict';
 const E=window.GaohuEdit;
 const edit=document.querySelector('#read-edit'), download=document.querySelector('#read-export'), notice=document.querySelector('#read-notice');
 let selected=null,editing=false,saving=false,adding=false;
 const q=(s,e=document)=>e.querySelector(s);
 const ring={
   id:'ring', name:'环形展陈 · 背景', title:'看龙队合舞',
   desc:'项目资料中的街头实拍，可观察队员举杆、龙头前行与后节跟进。这不是某一式的标准分解。',
   image:GaohuEmbedded('assets/hero.webp'), video:GaohuEmbedded('assets/field/field-dance.mp4'),
   poster:GaohuEmbedded('assets/field/field-dance.jpg'), link:'#field',
 };
 function element(tag, cls, content){
   const el=document.createElement(tag);if(cls)el.className=cls;if(content!=null)el.textContent=content;return el;
 }
 function toolbar(on){
   edit.hidden=!on;download.hidden=!E.hasEdits()||!on||adding;
   edit.textContent=adding?'取消添加':editing?'返回详情':'编辑此处';
 }
 function openSurface(){
   if(!read.open)read.showModal();
   readBody.scrollTop=0;q('#read-close').focus({preventScroll:true});
 }
 function prep(mode){
   clearReading();editing=mode;notice.textContent='';toolbar(true);
 }
 function renderPreview(message=''){
   if(!selected)return;
   prep(false);
   const defaults=selected, rec=E.get(defaults.id);
   const section=element('section','slot-content');
   const title=element('h1','slot-title',rec?.title||defaults.title);title.id='read-title';
   section.append(element('p','slot-eyebrow',defaults.name),title);
   const description=rec?rec.desc:defaults.desc;
   if(description)section.append(element('p','slot-desc',description));
   const image=E.objectURL(rec?.image)||defaults.image;
   const video=E.objectURL(rec?.video)||(!rec?.image?defaults.video:'');
   if(video){
     const player=element('video','slot-media');player.src=video;player.poster=rec?.image?image:(defaults.poster||image);
     player.controls=true;player.playsInline=true;player.preload='metadata';player.setAttribute('aria-label',title.textContent);
     section.append(player);
   }else if(image){
     const pic=element('img','slot-media');pic.src=image;pic.alt=title.textContent;section.append(pic);
   }
   if(defaults.link){
     const link=element('a','slot-original','查看原展品资料 ↗');link.href=defaults.link;section.append(link);
   }
   readBody.append(section);openSurface();notice.textContent=message;
 }
 function renderEditor(){
   if(!selected)return;
   prep(true);
   const rec=E.get(selected.id)||{};
   const section=element('section','slot-content');
   const title=element('h1','slot-title',adding?'添加新展品':'编辑内容');title.id='read-title';
   section.append(element('p','slot-eyebrow',selected.name),title);
   const form=element('form','slot-form');
   form.innerHTML=`
    <label class="slot-control" for="slot-title">标题</label>
    <input id="slot-title" name="title" required maxlength="60" autocomplete="off">
    <label class="slot-control" for="slot-desc">说明</label>
    <textarea id="slot-desc" name="desc" rows="4" maxlength="1200"></textarea>
    <fieldset class="slot-media-fields"><legend>${adding?'添加':'替换'}素材（可选）</legend>
      <div class="slot-file"><label for="slot-image">图片</label><input id="slot-image" type="file" accept="image/jpeg,image/png,image/webp,image/gif,.jpg,.jpeg,.png,.webp,.gif"><label class="slot-remove"><input type="checkbox" name="removeImage"> 移除已添加图片</label></div>
      <div class="slot-file"><label for="slot-video">视频</label><input id="slot-video" type="file" accept="video/mp4,video/webm,.mp4,.webm"><label class="slot-remove"><input type="checkbox" name="removeVideo"> 移除已添加视频</label></div>
    </fieldset>
    <p class="slot-hint">单个文件最多 40 MB。${adding?'也可以只填标题和说明。':'不选新文件就保留现有素材。换图后不再播放原视频；如需动效，可另选视频。'}</p>
    <div class="slot-actions"><button type="submit" class="slot-save">保存修改</button><button type="button" class="slot-reset">恢复原内容</button></div>
    <p class="slot-hint">文件和修改只留在本机。带走或分享请点「下载 HTML」。</p>
    <p class="slot-feedback" role="status"></p>`;
   q('#slot-title',form).value=rec.title??selected.title;
   q('#slot-desc',form).value=rec.desc??selected.desc;
   for(const [type,field] of [['image','removeImage'],['video','removeVideo']]){
     const checkbox=form.elements[field],input=q('#slot-'+type,form);
     checkbox.disabled=!rec[type];
     if(rec[type])checkbox.parentElement.after(element('small','slot-filename','已添加：'+rec[type].name));
     input.addEventListener('change',()=>{if(input.files.length)checkbox.checked=false;});
     checkbox.addEventListener('change',()=>{if(checkbox.checked)input.value='';});
   }
   const reset=q('.slot-reset',form),save=q('.slot-save',form);
   reset.hidden=!E.get(selected.id)||adding;
   save.textContent=adding?'添加展品':'保存修改';
   if(selected.custom)reset.textContent='移除展品';
   const busy=on=>{saving=on;save.disabled=on;reset.disabled=on;edit.disabled=on;q('#read-close').disabled=on;};
   const update=async record=>{
     if(saving)return;
     busy(true);
     try{
       const id=selected.id,wasNew=adding,custom=selected.custom;
       const local=await E.set(id,record);
       adding=false;
       if(record&&custom)selected=E.customItem(id);
       refreshGallery(wasNew?id:'');
       if(!record&&custom){
         read.close();
         window.galleryAnnouncement(local?'已移除展品。':'已移除展品。请重新下载 HTML 保存。');
         document.querySelector('.sphere-world .sb-open, .ex-wall')?.focus({preventScroll:true});
         return;
       }
       const message=wasNew?'已添加到环形展陈和龙珠球幕。':record?'已保存修改。':'已恢复原内容。';
       renderPreview(message+(local?'':' 请下载 HTML 保留这次修改。'));
     }catch(e){q('.slot-feedback',form).textContent=e.message;}
     finally{busy(false);}
   };
   form.addEventListener('submit',ev=>{
     ev.preventDefault();
     try{
       const title=q('#slot-title',form).value.trim(),desc=q('#slot-desc',form).value.trim();
       if(!title){q('#slot-title',form).focus();throw Error('请输入标题。');}
       const image=E.fileValue(q('#slot-image',form).files[0],'image')||(form.elements.removeImage.checked?null:rec.image);
       const video=E.fileValue(q('#slot-video',form).files[0],'video')||(form.elements.removeVideo.checked?null:rec.video);
       update({title,desc,image,video});
     }catch(e){q('.slot-feedback',form).textContent=e.message;}
   });
   reset.addEventListener('click',()=>{
     if(selected.custom&&reset.dataset.confirm!=='yes'){
       reset.dataset.confirm='yes';reset.textContent='确认移除';
       q('.slot-feedback',form).textContent='确认后，这项自订展品将从两个页面移除。';
       return;
     }
     update(null);
   });
   section.append(form);readBody.append(section);openSurface();q('#slot-title',form).focus({preventScroll:true});
 }
 edit.addEventListener('click',()=>adding?read.close():editing?renderPreview():renderEditor());
 const announce=document.querySelector('#gallery-announce');
 window.galleryAnnouncement=message=>{announce.textContent=message;};
 window.openAddExhibit=()=>{
   if(saving)return;
   try{
     selected={id:E.newId(),custom:true,name:'环形展陈与龙珠球幕',title:'',desc:'',image:'',video:''};
     adding=true;renderEditor();
   }catch(error){
     window.galleryAnnouncement(error.message);
     // The limit is also visible, not only announced to screen readers.
     window.alert(error.message);
   }
 };
 download.addEventListener('click',async()=>{
   download.disabled=true;notice.textContent='正在打包展陈素材，请保持页面打开…';
   try{await E.exportPage();notice.textContent='已生成可离线打开的 HTML。';}
   catch(e){notice.textContent='生成失败：'+e.message;}
   finally{download.disabled=false;}
 });
 read.addEventListener('cancel',e=>{if(saving)e.preventDefault();});
 document.addEventListener('click',e=>{
   if(e.target.closest('[data-ring-bg]'))window.showRingDetails();
 });
 window.clearGalleryEditor=()=>{
   selected=null;editing=false;adding=false;toolbar(false);notice.textContent='';
 };
 window.isGallerySaving=()=>saving;
 window.openGalleryItem=item=>{if(saving||!item)return;adding=false;selected=item;renderPreview();};
 window.showRingDetails=()=>window.openGalleryItem(ring);
})();
</script>
</body></html>
