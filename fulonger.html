 const lift=(t,a,b)=>ease(t/a)*ease((1-t)/b);
 function create(T,model,host,reduced){
   model.updateMatrixWorld(true);
   const joints={};
   for(const k of names){
     const bone=model.getObjectByName(k)||model.getObjectByName(T.PropertyBinding.sanitizeNodeName(k));
     if(!bone?.isBone)continue;
     const parent=bone.parent.getWorldQuaternion(new T.Quaternion()),inverse=parent.clone().invert();
     joints[k]={bone,rest:bone.quaternion.clone(),parent,inverse};
   }
   if(!joints.head&&!joints['spine.01'])return null;
   let selected='idle',since=0,auto=true,index=0,start=performance.now(),next=start+1050;
   const e=new T.Euler(0,0,0,'XYZ'),q=new T.Quaternion();
   function rot(name,x=0,y=0,z=0){
     const b=joints[name];if(!b)return;const scale=reduced.matches?.42:1;e.set(x*rad*scale,y*rad*scale,z*rad*scale);q.setFromEuler(e);
     b.bone.quaternion.copy(b.inverse).multiply(q).multiply(b.parent).multiply(b.rest);
   }
   function state(s){selected=s;host.dataset.action=s;host.dataset.actionLabel=labels[s];}
   state('idle');
   const wantsAuto=()=>auto&&!reduced.matches;
   function play(action,t=performance.now()){
     if(!Object.hasOwn(length,action))return false;
     index=1;since=t;next=t+length[action]+5900;state(action);
     return true;
   }
   function setAuto(on,t=performance.now()){
     auto=on;next=t+5200;
     if(!on)state('idle');
   }
   function update(t,voice){
     if(selected!=='idle'&&t-since>=length[selected])state('idle');
     if(!index&&selected==='idle'&&wantsAuto()&&t>=next){index=1;play('wave',t);}
     const phase=(t-start)/1000;
     const drift=wantsAuto()?1:0;
     const breath=Math.sin(phase*1.45)*drift,sway=(Math.sin(phase*.84)+.25*Math.sin(phase*.37))*drift;
     const talking=voice?(Math.sin(phase*3.4)*1.5+Math.sin(phase*2.3)*.75):0;
     let nod=0,turn=0,tilt=0,armLift=0,armFront=0,elbow=0,wrist=0,otherElbow=0,otherArm=0;
     if(selected==='wave'){
       const u=(t-since)/length.wave,p=lift(u,.24,.28);
       const flutter=Math.sin((u-.25)*Math.PI*7)*lift((u-.21)/.62,.25,.30);
       armLift=37*p;elbow=(76+flutter*7)*p;armFront=-10*p;
       wrist=flutter*13*p;nod=3.6*p;turn=-4.2*p;tilt=-2.6*p;
     }else if(selected==='nod'){
       const u=(t-since)/length.nod;
       nod=(11*Math.sin(Math.PI*Math.min(1,u/.73))**2-2.5*Math.sin(Math.PI*ease((u-.54)/.46)));
       tilt=1.3*lift(u,.28,.28);
     }else if(selected==='explain'){
       const u=(t-since)/length.explain,p=lift(u,.31,.30);
       armLift=10*p;armFront=-16*p;elbow=37*p;wrist=-7*p;
       otherArm=6*p;otherElbow=14*p;turn=5*p;nod=3*Math.sin(Math.PI*u)*p;
     }
     rot('spine.01',.65*breath,0,1.65*sway);
     rot('spine.02',.72*breath,0,.82*sway);
     rot('chest',.52*breath+.12*nod,turn*.27,.38*sway);
     rot('neck',nod*.24+.35*breath,turn*.27,tilt*.35);
     rot('head',nod*.67+talking,turn*.63+2.10*sway,tilt*.65);
     rot('upper_arm.L',armFront+breath*.80,0,armLift+sway*.65);
     rot('forearm.L',-2*armLift/46,0,elbow);
     rot('hand.L',0,wrist*.4,wrist);
     rot('upper_arm.R',breath*.7,0,-otherArm-sway*.65);
     rot('forearm.R',-5*otherElbow/14,0,-otherElbow);
   }
   return {play,setAuto,update,running:()=>wantsAuto()||selected!=='idle'||host.dataset.speaking==='true',auto:()=>auto};
 }
 window.FulongMotion={create};
})();

</script>
<script>
(() => {
 'use strict';
 const key='fulonger.guide.endpoint.v1';
 const dlg=document.querySelector('#api-dialog');
 const opener=document.querySelector('#api-open');
 const field=document.querySelector('#api-endpoint');
 const status=document.querySelector('#api-status');

 const error=document.querySelector('#api-error');
 const linkable=new Set(['wave','nod','explain']);
 let endpoint='';
 function normalize(value){
   const trimmed=value.trim();
   if(!trimmed)return '';
   const url=new URL(trimmed,location.href);
   const local=['localhost','127.0.0.1','[::1]'].includes(url.hostname);
   if(url.username||url.password||url.hash||!(url.protocol==='https:'||(url.protocol==='http:'&&(local||url.origin===location.origin))))throw Error('请填写 HTTPS 地址，或使用本机 HTTP 接口（localhost / 127.0.0.1）。');
   return url.href;
 }
 const configuredByServer=document.querySelector('meta[name="fulong-local-ai"]')?.content==='/api/guide'&&location.protocol==='http:';
 const automatic=configuredByServer?new URL('/api/guide',location.href).href:'';
 try{
   const choice=localStorage.getItem(key);
   endpoint=choice==='offline'?'':normalize(choice||'')||automatic;
 }catch{endpoint=automatic;}
 function set(value){
   endpoint=value;
   try{if(value)localStorage.setItem(key,value);else if(automatic)localStorage.setItem(key,'offline');else localStorage.removeItem(key);}catch{}
   status.textContent=value&&value===automatic?'第三方 AI':value?'已配置接口':'展馆资料';
   opener.setAttribute('data-configured',String(Boolean(value)));
   document.querySelector('.dg-note').textContent=value?'问答由你配置的接口提供。':'使用展馆资料回答。';
   document.dispatchEvent(new Event('fulonger-api-change'));
 }
 opener.addEventListener('click',()=>{error.textContent='';field.value=endpoint;dlg.showModal();field.focus();});
 dlg.querySelector('form').addEventListener('submit',e=>{
   e.preventDefault();
   try{set(normalize(field.value));dlg.close();}
   catch(e){error.textContent=e instanceof TypeError?'请填写完整的接口 URL。':e.message;field.focus();}
 });
 dlg.querySelector('[data-api-close]').addEventListener('click',()=>dlg.close());
 dlg.querySelector('[data-api-clear]').addEventListener('click',()=>{set('');dlg.close();});
 dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close();});
 dlg.addEventListener('close',()=>opener.focus());
 function mediaAddress(from,link){
   if(typeof link!=='string'||!link||link.length>1500)return '';
   try{
     const u=new URL(link,from);
     if(u.origin!==new URL(from).origin||u.username||u.password)return '';
     return u.href;
   }catch{return '';}
 }
 async function ask(question,signal,history=[]){
   const to=endpoint;
   if(!to)throw Error('接口尚未配置。');
   const controller=new AbortController();
   const cancel=()=>controller.abort();
   signal.addEventListener('abort',cancel,{once:true});
   if(signal.aborted)cancel();
   const timer=setTimeout(cancel,to===automatic?45000:15000);
   try{
     const res=await fetch(to,{method:'POST',credentials:'omit',redirect:'error',signal:controller.signal,
       headers:{'Content-Type':'application/json','Accept':'application/json'},
       body:JSON.stringify({question,character:'fulonger',locale:'zh-CN',history:history.slice(-8).map(({role,content})=>({role,content:content.slice(0,1800)}))})});
     if(!res.ok)throw Error('接口返回 '+res.status);
     const payload=await res.json();
     if(typeof payload?.answer!=='string'||!payload.answer.trim())throw Error('接口未返回 answer。');
     return {title:'福珑儿的回答',text:payload.answer.trim().slice(0,2400),audioUrl:mediaAddress(to,payload.audioUrl),
       action:linkable.has(payload.action)?payload.action:'explain'};
   }finally{clearTimeout(timer);signal.removeEventListener('abort',cancel);}
 }
 set(endpoint);
 window.FulongApi={enabled:()=>Boolean(endpoint),ask};
})();

</script>
<script>
(() => {
 'use strict';
 const media=s=>GaohuEmbedded('assets/guide/'+s);
 const systemMotion=matchMedia('(prefers-reduced-motion: reduce)');
 const stage=document.querySelector('.vc-canvas'),poster=document.getElementById('vc-poster');
 const audio=document.getElementById('reply-audio');
 poster.src=media('portrait.png');
 async function prepareModel(){
   const threeUrl=GaohuEmbedded('assets/vendor/three.js');
   const [T,utils,loader,model]=await Promise.all([
     import(threeUrl),
     fetch(media('BufferGeometryUtils.js')).then(r=>r.text()),
     fetch(media('GLTFLoader.js')).then(r=>r.text()),
     fetch(media('fulonger.glb.gz')).then(r=>{if(!r.ok)throw Error('Model download');return new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();}),
   ]);
   const moduleUrl=content=>URL.createObjectURL(new Blob([content],{type:'text/javascript'}));
   const utilsUrl=moduleUrl(utils.replace("from 'three'",`from '${threeUrl}'`));
   const loaderUrl=moduleUrl(loader.replace("from 'three'",`from '${threeUrl}'`).replace("'../utils/BufferGeometryUtils.js'",`'${utilsUrl}'`));
   try{
     const {GLTFLoader}=await import(loaderUrl);
     const {scene:modelScene}=await new GLTFLoader().parseAsync(model,'');
     return {T,modelScene};
   }finally{URL.revokeObjectURL(loaderUrl);URL.revokeObjectURL(utilsUrl);}
 }
 function webPortrait({T,modelScene},host,audio){
   const renderer=new T.WebGLRenderer({alpha:true,antialias:true});
   renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
   renderer.setClearColor(0x000000,0);
   renderer.outputColorSpace=T.SRGBColorSpace;
   const scene=new T.Scene();
   scene.add(modelScene);
   scene.add(new T.HemisphereLight('#fff2dd','#855845',1.52));
   function light(color,p,x,y,z){const l=new T.DirectionalLight(color,p);l.position.set(x,y,z);scene.add(l);}
   light('#fff1df',2.15,-3,4,5);light('#e5d5bd',.55,3,1,4);light('#ffdcaa',1.25,2,2,-4);
   const camera=new T.OrthographicCamera(-1,1,1,-1,.01,80);
   modelScene.updateMatrixWorld(true);
   const box=new T.Box3().setFromObject(modelScene,true),height=box.max.y-box.min.y;
   if(!(height>0))throw Error('Avatar geometry missing');
   const c=box.getCenter(new T.Vector3());
   const target=new T.Vector3(c.x,box.min.y+.50*height,c.z);
   const blinks=[];
   modelScene.traverse(o=>{
     if(!o.morphTargetDictionary)return;
     for(const [name,i] of Object.entries(o.morphTargetDictionary))if(name.startsWith('Blink.'))blinks.push([o,i]);
   });
   const renderAbort=new AbortController(),signal=renderAbort.signal;
   let yaw=0,press=null,raf=0,last=0,timer=0,endBlink=0,active=true,onScreen=true;
   const motion=FulongMotion.create(T,modelScene,host,systemMotion);
   host.dataset.motionRig=motion?'true':'false';
   host.append(renderer.domElement);
   renderer.domElement.setAttribute('aria-hidden','true');
   const paint=(time=performance.now())=>{
     if(!active)return;
     motion?.update(time,!audio.paused||host.dataset.speaking==='true');
     const a=yaw+(systemMotion.matches||audio.paused?0:Math.sin(time*.002)*.032);
     const distance=height*3;
     camera.position.set(target.x+Math.sin(a)*distance,target.y+height*.015,target.z+Math.cos(a)*distance);
     camera.lookAt(target);
     renderer.render(scene,camera);host.dataset.angle=String(yaw);
   };
   const shouldDraw=()=>active&&onScreen&&!document.hidden&&(motion?.running()||(!audio.paused&&!systemMotion.matches&&motion?.auto()));
   const play=()=>{if(!raf&&shouldDraw())raf=requestAnimationFrame(animate);};
   const animate=time=>{
     raf=0;if(!shouldDraw())return;
     const interval=host.clientWidth<460?55:44;
     if(time-last>=interval){last=time;paint(time);}
     play();
   };
   const stop=()=>{paint();play();};
   function resize(){
     const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;
     renderer.setSize(w,h,false);
     const span=Math.max(height*1.12,(box.max.x-box.min.x)*1.18*h/w);
     camera.top=span/2;camera.bottom=-span/2;camera.left=-span*w/h/2;camera.right=span*w/h/2;
     camera.updateProjectionMatrix();paint();
   }
   function blink(){
     if(!active)return;
     if(!systemMotion.matches&&!document.hidden){
       for(const [o,i] of blinks)o.morphTargetInfluences[i]=1;
       paint();endBlink=setTimeout(()=>{for(const [o,i] of blinks)o.morphTargetInfluences[i]=0;paint();},110);
     }
     timer=setTimeout(blink,4800+Math.random()*2500);
   }
   host.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0)return;press={id:e.pointerId,x:e.clientX,yaw};host.setPointerCapture?.(e.pointerId);},{signal});
   host.addEventListener('pointermove',e=>{if(press?.id!==e.pointerId)return;yaw=press.yaw+(e.clientX-press.x)*.012;paint();},{signal});
   for(const kind of ['pointerup','pointercancel'])host.addEventListener(kind,()=>{press=null;},{signal});
   audio.addEventListener('playing',play,{signal});host.addEventListener('dg-speaking',stop,{signal});
   for(const kind of ['pause','ended'])audio.addEventListener(kind,stop,{signal});
   systemMotion.addEventListener('change',()=>systemMotion.matches?stop():audio.paused?paint():play(),{signal});
   const observer=new ResizeObserver(resize);observer.observe(host);
   const visibleObserver=new IntersectionObserver(([entry])=>{onScreen=entry.isIntersecting;if(onScreen)play();},{threshold:.01});
   visibleObserver.observe(host);
   document.addEventListener('visibilitychange',()=>{if(!document.hidden)play();},{signal});
   host.addEventListener('dg-motion',e=>{
     const {action,manual}=e.detail;
     if(motion&&(manual||(motion.auto()&&!systemMotion.matches))){
       motion.play(action);paint();play();
     }
   },{signal});
   host.addEventListener('dg-auto',e=>{motion?.setAuto(e.detail);paint();play();},{signal});
   resize();timer=setTimeout(blink,3300);host.dataset.ready='true';host.dispatchEvent(new Event('dg-ready'));
   host.tabIndex=0;host.setAttribute('role','group');host.setAttribute('aria-label','福珑儿三维形象，拖动或用左右方向键旋转');
   function turn(step){
     yaw=step===0?0:yaw+step*.30;
     paint();
   }
   host.addEventListener('dg-turn',e=>turn(Number(e.detail)),{signal});
   host.addEventListener('keydown',e=>{
     if(!['ArrowLeft','ArrowRight','Home'].includes(e.key))return;
     e.preventDefault();turn(e.key==='Home'?0:e.key==='ArrowLeft'?-1:1);
   },{signal});
   play();
   return ()=>{
     active=false;renderAbort.abort();observer.disconnect();visibleObserver.disconnect();clearTimeout(timer);clearTimeout(endBlink);cancelAnimationFrame(raf);
     for(const [o,i] of blinks)o.morphTargetInfluences[i]=0;
     delete host.dataset.ready;host.removeAttribute('tabindex');host.removeAttribute('role');host.removeAttribute('aria-label');
     scene.remove(modelScene);renderer.dispose();renderer.domElement.remove();
   };
 }

 prepareModel().then(result=>{webPortrait(result,stage,audio);}).catch(()=>{
   stage.replaceChildren();document.getElementById('avatar-fallback').hidden=false;
 });
})();
</script>
<script>
(() => {
 'use strict';
 const $=id=>document.getElementById(id);
 const main=$('voice-page'), chat=main.querySelector('.vc-chat'), avatar=main.querySelector('.vc-canvas');
 const list=$('turn-list'), status=$('voice-status'), button=$('voice-toggle'), label=$('voice-label');
 const cap=$('live-caption'), live=$('live-text'), spokenReply=$('reply-audio'), announcement=$('voice-announcement');
 const localTopics=JSON.parse($('guide-topics').textContent);
 const asset=name=>GaohuEmbedded('assets/guide/'+name);
 const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 const normalize=s=>String(s).toLowerCase().replace(/[\p{P}\p{Z}\p{S}]+/gu,'');
 const rescue={text:'这题我还没学过。你可以继续问我高湖的来历、九节布龙，或者舞龙时为什么敲鼓。',id:'unknown'};
 const brief=fr=>new Promise(ok=>setTimeout(ok,fr));
 const reduced=matchMedia('(prefers-reduced-motion: reduce)');
 let localPack=false,rec=null,engaged=false,epoch=0,noSpeech=0,relisten=0,permissionTimer=0,answerRequest=null,pendingBubble=null;
 let history=[],haltSound=()=>{},unlocked=false,queuedGesture;
 function setState(state,copy){
   main.dataset.state=state;status.textContent=copy;
   label.textContent=engaged?'结束对话':chat.hidden?'开始对话':'继续对话';
   button.setAttribute('aria-pressed',String(engaged));
 }
 function gesture(action){
   if(!avatar.dataset.ready){queuedGesture=action;return;}
   avatar.dispatchEvent(new CustomEvent('dg-motion',{detail:{action,manual:true}}));
 }
 avatar.addEventListener('dg-ready',()=>{if(queuedGesture){const cue=queuedGesture;queuedGesture=undefined;gesture(cue);}});
 function showCaption(text){
   live.textContent=text;cap.hidden=!text;
 }
 function revealChat(){
   if(chat.hidden){chat.hidden=false;main.classList.add('vc-in-chat');}
 }
 function scrollLatest(){list.scrollTop=list.scrollHeight;}
 function make(tag,css,text){
   const e=document.createElement(tag);if(css)e.className=css;if(text)e.textContent=text;return e;
 }
 function bubble(role,text){
   const block=make('article','vc-turn '+role);
   block.append(make('div','turn-meta',role==='user'?'你':'福珑儿'));
   if(text)block.append(make('p','turn-text',text));
   list.append(block);scrollLatest();
   return block;
 }
 function thinking(){
   const row=bubble('assistant');
   const t=make('div','turn-think','思考中');
   const dots=make('span','think-dots');dots.setAttribute('aria-hidden','true');
   for(let i=0;i<3;i++)dots.append(document.createElement('i'));
   t.append(dots);row.append(t);scrollLatest();pendingBubble=t;
   return {row,t};
 }
 function offline(question){
   const n=normalize(question);
   if(/^你好|^嗨|^哈喽/.test(n)&&n.length<8)return localTopics[0];
   const sorted=localTopics.map(t=>[t,t.keywords.reduce((s,k)=>n.includes(normalize(k))?s+k.length**2:s,0)]).sort((a,b)=>b[1]-a[1]);
   return sorted[0]?.[1]>0?sorted[0][0]:rescue;
 }
 function unlock(){
   if(unlocked)return;
   unlocked=true;
   // Prime the existing element with silence during the user's initial microphone click.
   try{spokenReply.src=asset('silence.wav');spokenReply.play().catch(()=>{});}catch{}
   try{speechSynthesis.getVoices();}catch{}
 }
 function speechVoice(){
   try{return speechSynthesis.getVoices().find(v=>v.localService&&/^zh([-_]|$)/i.test(v.lang));}
   catch{return undefined;}
 }
 function playable(result){return Boolean(result.id||result.audioUrl||speechVoice());}
 function speaking(on){
   avatar.dataset.speaking=on?'true':'false';avatar.dispatchEvent(new Event('dg-speaking'));
 }
 function say(result){
   haltSound();
   const url=result.audioUrl||(result.id?asset(result.id+'.mp3'):'');
   const zhVoice=url?undefined:speechVoice();
   if(!url&&!zhVoice)return Promise.resolve(false);
   return new Promise(resolve=>{
     let done=false;
     const local=new AbortController();
     const finish=(ok)=>{
       if(done)return;done=true;clearTimeout(limit);local.abort();
       if(haltSound===stop)haltSound=()=>{};
       speaking(false);resolve(ok);
     };
     const stop=()=>{finish(false);spokenReply.pause();if(zhVoice)speechSynthesis.cancel();};
     const limit=setTimeout(stop,90000);
     haltSound=stop;
     if(url){
       spokenReply.pause();spokenReply.src=url;
       spokenReply.addEventListener('playing',()=>speaking(true),{signal:local.signal});
       spokenReply.addEventListener('ended',()=>finish(true),{once:true,signal:local.signal});
       spokenReply.addEventListener('error',()=>finish(false),{once:true,signal:local.signal});
       spokenReply.play().catch(()=>finish(false));
     }else{
       const message=new SpeechSynthesisUtterance(result.text);
       message.lang=zhVoice.lang;message.voice=zhVoice;message.rate=.92;
       message.onstart=()=>{if(!done)speaking(true);};
       message.onend=()=>finish(true);message.onerror=()=>finish(false);
       try{speechSynthesis.speak(message);}catch{finish(false);}
     }
   });
 }
 async function type(node,text,turn){
   const characters=Array.from(text),total=characters.length;
   const duration=reduced.matches?Math.min(1100,32*total):Math.min(9300,Math.max(680,78*total));
   const start=performance.now();
   let written=0;
   while(written<total&&epoch===turn){
      const want=Math.max(1,Math.min(total,Math.floor((performance.now()-start)*total/duration)));
      if(want>written){node.textContent=characters.slice(0,want).join('');written=want;scrollLatest();}
      if(written<total)await brief(32);
   }
   if(epoch===turn){node.textContent=text;scrollLatest();}
 }
 function closeRecognition(){
   clearTimeout(permissionTimer);
   const old=rec;rec=null;
   if(old)try{old.abort();}catch{}
 }
 function cancelWork(reason){
   epoch++;queuedGesture=undefined;clearTimeout(relisten);closeRecognition();
   answerRequest?.abort();answerRequest=null;haltSound();spokenReply.pause();
   showCaption('');
   if(pendingBubble){pendingBubble.className='turn-source';pendingBubble.textContent=reason||'已暂停';pendingBubble=null;}
 }
 function stopTalk(text='对话已停止。'){
   engaged=false;cancelWork();setState('idle',text);
 }
 function scheduleListen(delay=250){
   clearTimeout(relisten);
   if(engaged&&!document.hidden)relisten=setTimeout(listen,delay);
 }
 function listen(){
   if(!engaged||rec||document.hidden)return;
   if(!Recognition){stopTalk('当前浏览器没有语音识别，请换支持语音识别的浏览器。');return;}
   let current,failed=false,handled=false;
   try{
     current=new Recognition();rec=current;
     current.lang='zh-CN';current.continuous=false;current.interimResults=true;current.maxAlternatives=1;
     if(localPack&&'processLocally' in current)current.processLocally=true;
     setState('starting','正在打开麦克风…');
     permissionTimer=setTimeout(()=>{if(rec===current)stopTalk('正在等待麦克风。请确认浏览器已允许，然后再试。');},18000);
     current.onstart=()=>{if(rec!==current)return;clearTimeout(permissionTimer);setState('listening','正在听，你可以直接说。');};
     current.onresult=event=>{
       if(rec!==current||handled)return;
       let final='',partial='';
       for(let i=0;i<event.results.length;i++){
         const r=event.results[i],copy=r[0]?.transcript||'';
         if(r.isFinal)final+=' '+copy;else partial+=' '+copy;
       }
       showCaption((final+' '+partial).trim());
       const question=Array.from(final.trim()).slice(0,100).join('');
       if(!question)return;
       handled=true;noSpeech=0;
       closeRecognition();
       void respond(question);
     };
     current.onerror=event=>{
       if(rec!==current)return;
       failed=true;
       if(event.error==='no-speech'){
         closeRecognition();
         if(++noSpeech>=3)stopTalk('暂时没听到声音，点一下可以继续。');
         else{setState('starting','刚才没听清，继续说就好。');scheduleListen(420);}
         return;
       }
       const known={
         'not-allowed':'请先允许浏览器访问麦克风，再点「开始对话」。',
         'service-not-allowed':'浏览器语音服务暂不可用。检查权限或换一个支持语音识别的浏览器。',
         'audio-capture':'没有找到可用的麦克风，请检查设备。',
         'network':'浏览器语音识别暂时连不上。请检查网络后再试。',
         'language-not-supported':'当前浏览器未提供可用的中文语音识别。',
       };
       stopTalk(known[event.error]||'语音识别中断，可以点麦克风重试。');
     };
     current.onend=()=>{
       if(rec!==current)return;
       clearTimeout(permissionTimer);rec=null;
       if(!failed&&!handled&&engaged){
         showCaption('');
         if(++noSpeech>=3)stopTalk('暂时没听到声音，点一下可以继续。');else scheduleListen(330);
       }
     };
     current.start();
   }catch{stopTalk('麦克风没有启动，请检查浏览器权限后重试。');}
 }
 async function respond(question){
    const turn=++epoch;
    showCaption(question);
    setState('finalizing','听到了。');
    // Keep the first real utterance visible under the centered avatar briefly.
    if(chat.hidden)await brief(reduced.matches?180:340);
    if(epoch!==turn||!engaged)return;
    revealChat();showCaption('');bubble('user',question);
    announcement.textContent='你说：'+question;
    const frame=thinking();gesture('nod');
    setState('thinking','福珑儿在思考…');
    const start=performance.now();
    let result,source='';
    if(FulongApi.enabled()){
      const controller=new AbortController();answerRequest=controller;
      try{result=await FulongApi.ask(question,controller.signal,history);}
      catch{if(epoch!==turn)return;source='接口暂不可用，使用展馆资料回答。';}
      finally{if(answerRequest===controller)answerRequest=null;}
    }
    if(epoch!==turn||!engaged)return;
    result||=offline(question);
    await brief(Math.max(0,1050-(performance.now()-start)));
    if(epoch!==turn||!engaged)return;
    frame.t.remove();pendingBubble=null;
    const paragraph=make('p','turn-text');frame.row.append(paragraph);
    if(source)frame.row.append(make('p','turn-source',source));
    setState('speaking','福珑儿在回答…');
    gesture('explain');
    const [voiced]=await Promise.all([say(result),type(paragraph,result.text,turn)]);
    if(epoch!==turn||!engaged)return;
    announcement.textContent='福珑儿回答：'+result.text;
    history.push({role:'user',content:question},{role:'assistant',content:result.text});
    history=history.slice(-12);
    if(playable(result)){
      const replay=make('button','turn-play',voiced?'再听一遍':'播放语音');
      replay.type='button';frame.row.append(replay);
      replay.addEventListener('click',async()=>{
        if(['finalizing','thinking','speaking'].includes(main.dataset.state))return;
        clearTimeout(relisten);closeRecognition();showCaption('');
        const moment=++epoch;
        setState('speaking','正在播放…');
        if(!await say(result)&&epoch===moment)status.textContent='语音未播放，可以阅读右侧文字。';
        if(epoch!==moment)return;
        if(engaged)scheduleListen(280);else setState('idle','点麦克风继续对话。');
      });
    }else frame.row.append(make('p','turn-source','这条回复暂没有可播放的语音。'));
    scrollLatest();
    setState('starting','可以继续说，我在听。');
    scheduleListen(300);
 }
 button.addEventListener('click',()=>{
   if(engaged){stopTalk();return;}
   if(!Recognition){stopTalk('当前浏览器没有语音识别，请换支持语音识别的浏览器。');return;}
   unlock();engaged=true;noSpeech=0;gesture('nod');listen();
 });
 $('chat-reset').addEventListener('click',()=>{
   stopTalk('点一下麦克风，直接开口。');chat.hidden=true;main.classList.remove('vc-in-chat');list.replaceChildren();history=[];announcement.textContent='';
   button.focus({preventScroll:true});
 });
 $('api-open').addEventListener('click',()=>{if(engaged||main.dataset.state==='speaking')stopTalk('设置完成后，点麦克风继续。');});
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&(engaged||main.dataset.state==='speaking'))stopTalk('切回页面后，点麦克风继续。');});
 window.addEventListener('pagehide',()=>{if(engaged||main.dataset.state==='speaking')stopTalk();});
 if(Recognition?.available){
   try{Promise.resolve(Recognition.available({langs:['zh-CN'],processLocally:true})).then(value=>{
     if(value==='available'){localPack=true;main.querySelector('.vc-privacy').textContent='使用浏览器已安装的中文语音识别。';}
   }).catch(()=>{});}catch{}
 }
 if(!Recognition)setState('idle','当前浏览器没有语音识别功能。');
})();
